name: codehere
on: pull_request
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ./action
        with:
          version: https://raw.githubusercontent.com/${{ github.repository }}/main/vendor/codehere-1.0.2.tgz
